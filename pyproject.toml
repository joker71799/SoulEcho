[project]
name = "soulecho"
version = "0.1.0"
description = "个人心理疗愈Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "mem0ai>=2.1.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
# 后端以 backend/app 为导入根（main.py 里 from agent/config 平铺导入），测试同构
pythonpath = ["backend/app"]
testpaths = ["backend/app/tests"]
